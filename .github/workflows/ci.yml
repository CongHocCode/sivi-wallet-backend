name: Backend CI Pipeline

# Kích hoạt khi có code push lên develop hoặc khi mở Pull Request vào main/develop
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    name: Build & Verify Java 21 Spring Boot
    runs-on: ubuntu-latest # Chạy trên máy chủ Ubuntu ảo miễn phí của GitHub

    steps:
      # Bước 1: Kéo toàn bộ mã nguồn về máy chủ ảo
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt JDK 21 LTS (Eclipse Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Tự động cache các file .jar tải về để lần sau chạy siêu tốc (dưới 30s)

      # Bước 3: Cấp quyền chạy cho Maven wrapper (nếu có)
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw || true

      # Bước 4: Biên dịch mã nguồn và kiểm tra đóng gói
      - name: Build with Maven
        run: mvn clean compile test-compile package -DskipTests
